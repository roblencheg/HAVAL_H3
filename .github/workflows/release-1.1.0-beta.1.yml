name: Release v1.1.0-beta.1

on:
  push:
    branches:
      - feature/native-dashboard-cards
    paths:
      - .github/workflows/release-1.1.0-beta.1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.1.0-beta.1 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release already exists"
            exit 0
          fi
          gh release create v1.1.0-beta.1 \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "v1.1.0-beta.1" \
            --prerelease \
            --notes $'## Встроенные карточки GWM RU\n\n- Добавлены встроенные карточки Dashboard без привязки к конкретной модели\n- Карточки автоматически регистрируются в Home Assistant\n- Добавлена карточка поездок с локальной историей и Recorder fallback\n- Добавлены профили подготовки и backend-сервисы, необходимые карточкам\n- Это тестовый prerelease перед слиянием в master.'
