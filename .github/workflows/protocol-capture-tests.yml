name: Protocol capture tests

on:
  push:
    branches:
      - feature/protocol-capture
  pull_request:
    paths:
      - 'custom_components/gwm_ru/**'
      - 'tests/**'
      - '.github/workflows/protocol-capture-tests.yml'

jobs:
  capture-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: python -m compileall -q custom_components/gwm_ru tests
      - name: Validate integration manifest
        run: python -m json.tool custom_components/gwm_ru/manifest.json > /dev/null
      - name: Test privacy and capture logic without cloud or Home Assistant
        run: python -m unittest discover -s tests -p 'test_*.py' -v
