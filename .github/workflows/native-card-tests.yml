name: Native card checks

on:
  pull_request:
    paths:
      - "custom_components/gwm_ru/**"
      - ".github/workflows/native-card-tests.yml"
  push:
    branches:
      - master
      - fix/modern-remotes-v1.1.3
      - feature/native-dashboard-cards
    paths:
      - "custom_components/gwm_ru/**"
      - ".github/workflows/native-card-tests.yml"

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile Python
        run: python -m compileall -q custom_components/gwm_ru
      - name: Check bundled card JavaScript
        run: |
          node --input-type=module --check < custom_components/gwm_ru/frontend/gwm-vehicle-bundle.js
          node --check custom_components/gwm_ru/frontend/gwm-vehicle-card.js
          node --check custom_components/gwm_ru/frontend/gwm-vehicle-card-editor.js
          node --check custom_components/gwm_ru/frontend/gwm-vehicle-remote-card.js
          node --check custom_components/gwm_ru/frontend/gwm-vehicle-remote-horizontal-card.js
          node --check custom_components/gwm_ru/frontend/gwm-vehicle-remote-modern-card.js
          node --check custom_components/gwm_ru/frontend/gwm-vehicle-trips-card.js
          node --check custom_components/gwm_ru/frontend/gwm-vehicle-compat.js
      - name: Regression checks for card data dependencies
        run: |
          grep -q '"2016001": "engine_state_raw"' custom_components/gwm_ru/helpers.py
          grep -q '"fuel_percent": ExtraSensorDef' custom_components/gwm_ru/const.py
          grep -q 'calculate_fuel_percent(state.get("fuel_liters"), tank_capacity_number)' custom_components/gwm_ru/api.py
          grep -q 'state\["engine_on"\] = _state_equals(engine_item_state, "2")' custom_components/gwm_ru/helpers.py
          grep -q "entry.platform==='gwm_ru'" custom_components/gwm_ru/frontend/gwm-vehicle-trips-card.js
          grep -q "_location" custom_components/gwm_ru/frontend/gwm-vehicle-trips-card.js
          grep -q 'class="control-zone"' custom_components/gwm_ru/frontend/gwm-vehicle-remote-card.js
          grep -q 'class="sensor-zone"' custom_components/gwm_ru/frontend/gwm-vehicle-remote-card.js

      - name: Check horizontal remote registration
        run: |
          grep -q 'gwm-vehicle-remote-horizontal-card' custom_components/gwm_ru/frontend/gwm-vehicle-bundle.js
          grep -q 'grid-template-areas' custom_components/gwm_ru/frontend/gwm-vehicle-remote-horizontal-card.js
          grep -q 'grid-area:controls' custom_components/gwm_ru/frontend/gwm-vehicle-remote-horizontal-card.js
          grep -q 'grid-area:sensors' custom_components/gwm_ru/frontend/gwm-vehicle-remote-horizontal-card.js

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check responsive remote layouts
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2 @mdi/js@7.4.47
          npx playwright install --with-deps chromium
          node tests/remote-layouts.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: remote-previews
          path: /tmp/gwm-vehicle-remote-*.png
