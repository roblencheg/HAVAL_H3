name: Release v1.0.11

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/release-1.0.11.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create v1.0.11 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.11 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release v1.0.11 already exists"
            exit 0
          fi
          gh release create v1.0.11 \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "v1.0.11" \
            --notes $'## Исправления\n\n- Исправлено управление климатом: изменение температуры теперь действительно отправляет T5-команду `0x04` и включает климат\n- Добавлены явные turn_on / turn_off для ClimateEntity\n- Для Haval H3 добавлен optimistic state двигателя после успешных engine_start / engine_stop, так как российский getLastStatus не возвращает состояние двигателя\n- После remote start статус двигателя сохраняется до заданного operationTime или до команды остановки\n\n## Диагностика\n\nДиагностика показала, что до 1.0.11 изменение температуры при выключенном климате не отправляло команду в автомобиль: последней командой оставался `0x03` двигателя.'
