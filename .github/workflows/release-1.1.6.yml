name: Release v1.1.6
on:
  push:
    branches: [master]
    paths:
      - .github/workflows/release-1.1.6.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Backend regressions and syntax
        run: |
          python -m pip install aiohttp voluptuous
          python -m unittest discover -s tests -p 'test_*.py' -v
          python -m compileall -q custom_components/gwm_ru
          for f in custom_components/gwm_ru/frontend/gwm-*.js; do node --input-type=module --check < "$f"; done
      - name: Browser regression checks
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2 @mdi/js@7.4.47
          npx playwright install --with-deps chromium
          node tests/remote-layouts.cjs
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
  release:
    needs: [verify, hacs, hassfest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.1.6 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release already exists"
            exit 0
          fi
          gh release create v1.1.6 --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "v1.1.6 — исправления и оптимизация" --latest --notes-file docs/release-1.1.6.md
