name: Release v1.0.13-research.2

on:
  push:
    branches: [research-cloud-capabilities]
    paths:
      - '.github/workflows/release-1.0.13-research.2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/release-notes.md <<'EOF'
          ## GWM RU 1.0.13 research.2

          Вторая исследовательская сборка для более глубокого анализа российского облака GWM.

          ### Добавлено

          - `vehicleBasicsInfo` с `flag=true`;
          - корректный POST `getWeyVrcHistory` для `type=1/2/3`;
          - исследование compound / one-button comfort templates;
          - дополнительные v3 query-варианты с `vehicleId`, `modelCode` и `vtype`;
          - расширенное редактирование `userId`, токенов и идентификаторов;
          - VIN больше не сохраняется внутри diagnostic path.

          ### Цель

          Найти скрытые возможности облака, в первую очередь ACC / IGN / power-mode, а также дополнительные remote-функции и конфигурацию автомобиля.

          Исследовательские probes не отправляют команды управления автомобилем.
          EOF

          gh release create v1.0.13-research.2 \
            --repo "$GITHUB_REPOSITORY" \
            --target research-cloud-capabilities \
            --title "v1.0.13-research.2" \
            --notes-file /tmp/release-notes.md \
            --prerelease
