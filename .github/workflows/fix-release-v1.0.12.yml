name: Fix v1.0.12 release notes

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/fix-release-v1.0.12.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-release:
    runs-on: ubuntu-latest
    steps:
      - name: Update release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/release-notes.md <<'EOF'
          ## GWM RU 1.0.12

          Стабильный релиз интеграции GWM RU для Home Assistant.

          ### Что нового

          - Автоматическое определение возможностей конкретного автомобиля через облако GWM.
          - Удалённый запуск и остановка двигателя.
          - Управление замками, багажником, окнами, люком и климатом.
          - Рабочее управление обогревом руля и лобового стекла.
          - Управление обогревом водительского и пассажирского сидений с уровнями `0-3`.
          - Добавлены датчики ошибок давления и температуры шин TPMS.
          - Добавлены состояния переднего дефроста и GPS.
          - Добавлена история удалённых команд.
          - Задержка между удалёнными командами уменьшена до 5 секунд.
          - После подтверждённого запуска или остановки двигателя источник состояния отображается как `remote_command_result`.
          - Диагностика очищена от исследовательских запросов и дополнительно скрывает чувствительные идентификаторы.

          ### Проверено

          На Haval H3 через российское облако GWM. В живых тестах подтверждены запуск и остановка двигателя, обогрев руля, обогрев лобового стекла и обогрев обоих передних сидений с синхронизацией состояния в официальном приложении GWM.
          EOF

          gh release edit v1.0.12 \
            --repo "$GITHUB_REPOSITORY" \
            --title "v1.0.12" \
            --notes-file /tmp/release-notes.md
