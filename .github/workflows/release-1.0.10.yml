name: Release v1.0.10

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/release-1.0.10.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create v1.0.10 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.10 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release v1.0.10 already exists"
            exit 0
          fi
          gh release create v1.0.10 \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "v1.0.10" \
            --notes $'## Исправления и диагностика\n\n- Исправлено отображение состояния замка: Home Assistant теперь корректно показывает закрыт/открыт\n- Сохранён прежний unique ID сущности замка\n- В диагностику добавлены сырые code/value из getLastStatus\n- В диагностику добавлены верхнеуровневые поля статуса автомобиля\n- В диагностику добавлен тип и результат последней T5-команды\n\nЭто диагностический релиз для определения реального сигнала работающего двигателя Haval H3 и разбора поведения климат-контроля.'
