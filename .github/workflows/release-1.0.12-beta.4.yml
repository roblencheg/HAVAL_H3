name: Release v1.0.12-beta.4

on:
  push:
    branches:
      - beta-capabilities
    paths:
      - .github/workflows/release-1.0.12-beta.4.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.12-beta.4 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release already exists"
            exit 0
          fi
          gh release create v1.0.12-beta.4 \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "v1.0.12-beta.4" \
            --prerelease \
            --notes $'## Read-only API probes\n\n- В diagnostics добавлены безопасные GET-пробы `vehicle/getWeyVrcHistory`\n- Добавлены GET-пробы `vehicle/getCompoundCommandTemplateList`\n- Для каждого endpoint пробуются несколько вероятных наборов параметров\n- Ответы и ошибки сохраняются отдельно по VIN\n- Обычный polling и remote-команды не менялись\n\nЦель: раскопать историю remote-команд и One Button Comfort/compound templates без риска для машины.'
