name: Remove experimental capture releases

on:
  push:
    branches:
      - feature/protocol-capture
    paths:
      - .github/workflows/remove-capture-releases.yml

permissions:
  contents: write

jobs:
  remove-releases:
    runs-on: ubuntu-latest
    steps:
      - name: Delete only the two capture prereleases and their tags
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          for tag in v1.0.13-capture.1 v1.0.13-capture.2; do
            if gh release view "$tag" --repo "$REPOSITORY" >/dev/null 2>&1; then
              gh release delete "$tag" --repo "$REPOSITORY" --cleanup-tag --yes
              echo "Removed release and tag: $tag"
            else
              echo "Release not found: $tag"
            fi
          done
