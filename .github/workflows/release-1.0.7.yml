name: Release v1.0.7

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/release-1.0.7.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create v1.0.7 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.7 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release v1.0.7 already exists"
            exit 0
          fi
          gh release create v1.0.7 \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "v1.0.7" \
            --notes $'## Что нового\n\n- Добавлен дистанционный запуск двигателя\n- Добавлена дистанционная остановка двигателя\n- Добавлены сервисы `engine_start` и `engine_stop`\n- Добавлен общий статус автомобиля: `Запущена`, `Открыта`, `На охране`, `Неизвестно`\n- Добавлены binary sensors для двигателя, замка, дверей, багажника и климата\n- Версия интеграции обновлена до `1.0.7`\n\n## Важно\n\nУдалённое управление работает только при включённых remote controls и наличии PIN-кода безопасности.'
