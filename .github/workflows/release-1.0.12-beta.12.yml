name: Release v1.0.12-beta.12

on:
  push:
    branches:
      - beta-capabilities
    paths:
      - .github/workflows/release-1.0.12-beta.12.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.12-beta.12 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release already exists"
            exit 0
          fi
          gh release create v1.0.12-beta.12 \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "v1.0.12-beta.12" \
            --prerelease \
            --notes $'## APK-derived seat and windshield controls\n\n- Reverse-engineered the official GWM Russia 2.3.1 APK CmdRequestFactory\n- Added windshield-heater switch using T5 0x2A with the official switchOrder/operationTime shape\n- Added driver and passenger seat-heater level selects (Off/1/2/3) using T5 0x0A seat payload\n- Seat payload preserves the other front-seat level and maps driver/passenger to physical left/right using the vehicle rudder flag\n- Official APK defaults: seat heating 5 min, windshield heating 15 min\n- Capability-driven entity creation remains in place\n- Default command cooldown remains 5 seconds.'
